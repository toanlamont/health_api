app = 'health-api-thunt'
primary_region = 'sin'

[build]

[env]
  DATABASE_URL = "sqlite+aiosqlite:////app/data/health.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = "health_data"
  destination = "/app/data"

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
